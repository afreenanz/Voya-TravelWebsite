[project]
name = "voya"
version = "1.0.0"
description = "AI travel planner — Flask + Supabase + OpenRouter"
requires-python = ">=3.12"
# Keep in sync with backend/requirements.txt.
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.9",
    "python-dotenv==1.2.4",
    "supabase==2.34.1",
    "requests==2.34.2",
    "PyJWT==2.15.1",
]

[tool.vercel]
entrypoint = "backend.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: talks to the real Supabase project from .env"]
